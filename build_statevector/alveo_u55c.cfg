# =====================================================================
# alveo_u55c.cfg  (statevector kernel — opt_kernel.cpp, 3-port design)
# v++ system configuration for quantum_fpga_kernel_complex128
# Platform: xilinx_u55c_gen3x16_xdma_3_202210_1
#
# opt_kernel.cpp exposes exactly 3 AXI-master arguments:
#   state_real, state_imag  (double* — the two flat statevector arrays)
#   gate_sequence           (int*   — packed gate instruction stream)
# unlike the older 8-bank interleaved design this replaces, so bank
# assignment here targets those 3 argument names directly (sp=<cu>.<arg>).
#
# HBM2 on U55C: 32 PCs x 256 MB. A full 28-qubit statevector needs
# 2^28 * 8B = 2 GB per array (real, imag independently) — 8 PCs each
# at 256 MB/PC. gate_sequence only needs to hold num_gates*8 int32
# words (<=512 gates/call * 32B = 16 KB), so 1 PC is generous headroom.
# Total: 17 of 32 PCs used, 15 free for future scaling.
# =====================================================================

[connectivity]
sp=quantum_fpga_kernel_complex128_1.state_real:HBM[0:7]
sp=quantum_fpga_kernel_complex128_1.state_imag:HBM[8:15]
sp=quantum_fpga_kernel_complex128_1.gate_sequence:HBM[16]

# Pin to a single SLR near the HBM controller (SLR0 on U55C), same
# rationale as the prior 8-bank build: keeps wide AXI masters from
# spreading across SLR boundaries and causing routing congestion.
slr=quantum_fpga_kernel_complex128_1:SLR0

[clock]
# 225 MHz is the frequency that closed timing successfully for the
# previous (8-bank) build of this kernel family on this platform in
# ~4h of place/route. This design has fewer, narrower AXI masters (3
# vs 9) and a branch-heavy but per-op-simple EXEC loop, so 225 MHz is
# a conservative, low-risk starting point rather than an aggressive one.
freqHz=225000000:quantum_fpga_kernel_complex128_1

[vivado]
# Timing closure directives carried over from the build that succeeded
# on this platform for the sibling 8-bank kernel.
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore

[advanced]
param=compiler.addOutputTypes=hw_export
misc=solution_name=opt_kernel_3port_fixed
