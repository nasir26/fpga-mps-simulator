[connectivity]
# 1. Instantiate one Compute Unit (CU) of the kernel
nk=quantum_fpga_kernel_complex128:1:quantum_kernel_1

# 2. Map the Real amplitudes across 4 HBM banks (Banks 0 to 3)
# The Vitis shell will automatically stripe the 512-bit AXI bus across these banks.
sp=quantum_kernel_1.m_axi_gmem_real:HBM[0:3]

# 3. Map the Imaginary amplitudes across 4 HBM banks (Banks 4 to 7)
sp=quantum_kernel_1.m_axi_gmem_imag:HBM[4:7]

# 4. Map the gate instruction queue to DDR (or a separate HBM bank like HBM[8] if available)
# This keeps instruction fetch completely separate from state-vector memory traffic.
sp=quantum_kernel_1.m_axi_gmem_instr:DDR[0]

[profile]
# Optional: Enable profiling to prove to the team that all 8 banks are being utilized
data=all:all:all
stall=all:all