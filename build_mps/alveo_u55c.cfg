# =====================================================================
# alveo_u55c.cfg  (MPS kernel — fpga_mps_simulator.cpp, 8-bank design)
# v++ system configuration for fpga_mps_simulator
# Platform: xilinx_u55c_gen3x16_xdma_3_202210_1
#
# HBM2 on U55C: 32 PCs x 256 MB. Kernel has 8 tensor-bank arguments
# (bank0..bank7) + 1 gate-sequence argument; each bank gets 3 PCs
# (768 MB/bank, 6 GB total) -- same width proven to close timing for
# the sibling 28-qubit statevector kernel build on this platform.
# Site tensors for a chi_max<=64, ~4000-qubit MPS chain (worst case
# ~4000 * 64*2*64 complex128 ~ 512 MB total, round-robin across 8
# banks) fit comfortably within this footprint with headroom for
# growth during 2-qubit-gate contraction (each gate allocates 2 fresh
# padded chi_max^2 sites before truncation).
# =====================================================================

[connectivity]
sp=fpga_mps_simulator_1.bank0:HBM[0:2]
sp=fpga_mps_simulator_1.bank1:HBM[3:5]
sp=fpga_mps_simulator_1.bank2:HBM[6:8]
sp=fpga_mps_simulator_1.bank3:HBM[9:11]
sp=fpga_mps_simulator_1.bank4:HBM[12:14]
sp=fpga_mps_simulator_1.bank5:HBM[15:17]
sp=fpga_mps_simulator_1.bank6:HBM[18:20]
sp=fpga_mps_simulator_1.bank7:HBM[21:23]
sp=fpga_mps_simulator_1.gate_seq:HBM[24]

# HBM[25:31] intentionally unassigned -- headroom for scaling bank
# capacity, matching the sibling kernel's config.
slr=fpga_mps_simulator_1:SLR0

[clock]
# Conservative starting point; contract_and_apply_2q's URAM-backed
# theta_re/theta_im buffers (64x4x64 complex doubles each) and the
# UNROLL factor=4 inner contraction loop are the most timing-sensitive
# parts of this kernel, so match the 225 MHz that closed timing for
# the sibling 8-bank statevector build rather than risk a higher target.
freqHz=225000000:fpga_mps_simulator_1

[vivado]
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=Explore
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.ROUTE_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore

[advanced]
param=compiler.addOutputTypes=hw_export
misc=solution_name=mps_kernel_fixed
